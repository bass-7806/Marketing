[build]
  command = "node build.js"
  publish = "dist"

[[redirects]]
  from = "/*"
  status = 404
  to = "/404.html"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
